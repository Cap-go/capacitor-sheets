name: PR beta publish prompt

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Upsert beta publish comment
        uses: actions/github-script@v9
        env:
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
        with:
          script: |
            const core = require('@actions/core');
            const marker = '<!-- pr-beta-publish -->';
            const maintenanceBots = new Set(['renovate[bot]', 'dependabot[bot]']);
            const pr = context.payload.pull_request;
            const prAuthor = pr.user?.login ?? '';

            if (maintenanceBots.has(prAuthor)) {
              core.info(`Skipping beta publish prompt for ${prAuthor}.`);
              return;
            }

            const sameRepo = process.env.IS_SAME_REPO === 'true';
            const body = sameRepo
              ? [
                  marker,
                  '',
                  '## Beta npm build',
                  '',
                  'Maintainers can publish this PR to npm for fast testing.',
                  '',
                  'Comment `/publish-beta` after the PR checks are green.',
                  '',
                  'The workflow will:',
                  '- publish a prerelease package on the `beta` tag',
                  '- add a pinned `pr-' + pr.number + '` dist-tag for this exact PR build',
                  '- update this comment with the install command',
                  '',
                  'Security note: beta publish is only enabled for branches inside this repository.',
                ].join('\n')
              : [
                  marker,
                  '',
                  '## Beta npm build',
                  '',
                  'This PR comes from a fork, so beta publish is disabled for security.',
                  '',
                  'If you need a beta package, move the branch into this repository first.',
                ].join('\n');

            const isBetaPromptComment = (comment) =>
              comment?.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker);

            const upsertComment = async () => {
              const { owner, repo } = context.repo;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existing = comments.find(isBetaPromptComment);

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            };

            try {
              await upsertComment();
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (pr.user?.type === 'Bot' || maintenanceBots.has(prAuthor)) {
                core.warning(
                  `Could not upsert beta publish comment on bot PR (HTTP ${status ?? 'unknown'}): ${error.message}`,
                );
                return;
              }
              throw error;
            }
